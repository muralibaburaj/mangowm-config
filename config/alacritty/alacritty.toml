[window]
# opacity=0.9
[window.padding]
y = 6
x = 6

[font]
# Use a monospaced font so Neovim's cell-based layout stays aligned.
# Nerd Font icons fall back to the installed Symbols Nerd Font Mono.
normal = { family = "JetBrains Mono", style = "Regular" }
# size = 20
size = 14


[colors.bright]
black   = "#585b70"
blue    = "#89b4fa"
cyan    = "#94e2d5"
green   = "#cba6f7"
magenta = "#f5c2e7"
red     = "#f38ba8"
white   = "#a6adc8"
yellow  = "#f9e2af"


[colors.primary]
background = "#1e1e2e"
foreground = "#cdd6f4"
dim_foreground = "#7f849c"
bright_foreground = "#cdd6f4"

[colors.cursor]
text = "#1e1e2e"
cursor = "#cba6f7"

[colors.vi_mode_cursor]
text = "#1e1e2e"
cursor = "#cba6f7"

[colors.search.matches]
foreground = "#1e1e2e"
background = "#a6adc8"

[colors.search.focused_match]
foreground = "#1e1e2e"
background = "#cba6f7"

[colors.footer_bar]
foreground = "#1e1e2e"
background = "#a6adc8"

[colors.hints.start]
foreground = "#1e1e2e"
background = "#f9e2af"

[colors.hints.end]
foreground = "#1e1e2e"
background = "#a6adc8"

[colors.selection]
text = "#1e1e2e"
background = "#cba6f7"

[colors.normal]
black   = "#45475a"
red     = "#f38ba8"
green   = "#cba6f7"
yellow  = "#f9e2af"
blue    = "#89b4fa"
magenta = "#f5c2e7"
cyan    = "#94e2d5"
white   = "#bac2de"

[[colors.indexed_colors]]
index = 16
color = "#fab387"

[[colors.indexed_colors]]
index = 17
color = "#f5e0dc"
